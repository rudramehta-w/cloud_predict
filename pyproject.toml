[project]
name = "cloudpredict"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "boto3>=1.43.118",
]

[project.scripts]
cloudpredict = "cloudpredict:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8",
    "hypothesis>=6",
    "pandas-stubs>=2.2",
    "httpx>=0.27",
    "boto3-stubs[s3]>=1.43.118",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src/cloudpredict"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "cloudpredict.domain.*"
strict = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "xgboost.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "live: requires a running Silo S3 endpoint (localhost:9000)",
]
